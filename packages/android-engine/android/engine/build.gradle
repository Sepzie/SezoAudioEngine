plugins {
  id "com.android.library"
  id "org.jetbrains.kotlin.android"
  id "maven-publish"
}

group = "com.github.Sepzie"
// Single source of truth: packages/android-engine/VERSION. JitPack sets the
// VERSION environment variable to the tag it builds, which takes precedence.
def versionFile = file("../../VERSION")
version = System.getenv("VERSION") ?: (versionFile.exists() ? versionFile.text.trim() : "0.0.1")

android {
  namespace "com.sezo.audioengine"
  compileSdk 35
  ndkVersion "27.1.12297006"

  defaultConfig {
    minSdk 24

    ndk {
      // When built inside a React Native app, follow the app's architecture list
      // (expo run:android passes only the connected device's ABI).
      def requestedAbis = project.findProperty("reactNativeArchitectures")
      if (requestedAbis) {
        abiFilters(*requestedAbis.toString().split(",").collect { it.trim() })
      } else {
        abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
      }
    }

    externalNativeBuild {
      cmake {
        cppFlags "-std=c++17", "-frtti", "-fexceptions"
        arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
      version "3.22.1"
    }
  }

  buildTypes {
    release {
      minifyEnabled false
    }
    debug {
      minifyEnabled false
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlin {
    compilerOptions {
      jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
  }

  publishing {
    singleVariant("release")
  }
}

dependencies {
  implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.0"
  implementation "androidx.annotation:annotation:1.7.1"
}

afterEvaluate {
  publishing {
    publications {
      release(MavenPublication) {
        from components.release
        groupId = project.group
        artifactId = "audio-engine"
        version = project.version
        pom {
          name = "Sezo Audio Engine"
          description = "Native Android audio engine for multi-track playback, pitch/speed control, recording, and extraction."
          url = "https://github.com/Sepzie/SezoAudioEngine"
          licenses {
            license {
              name = "MIT License"
              url = "https://opensource.org/licenses/MIT"
              distribution = "repo"
            }
          }
          developers {
            developer {
              id = "Sepzie"
              name = "Sepzie"
              url = "https://github.com/Sepzie"
            }
          }
          scm {
            connection = "scm:git:git://github.com/Sepzie/SezoAudioEngine.git"
            developerConnection = "scm:git:ssh://git@github.com:Sepzie/SezoAudioEngine.git"
            url = "https://github.com/Sepzie/SezoAudioEngine"
          }
        }
      }
    }
  }
}

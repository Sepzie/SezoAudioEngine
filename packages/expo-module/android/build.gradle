import groovy.json.JsonSlurper
import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
  id "com.android.library"
  // Applies kotlin-android (or relies on AGP 9's built-in Kotlin), kotlin-stdlib matching the app's
  // kotlinVersion, compileOnly expo-modules-core, and the app's compileSdk/minSdk.
  id "expo-module-gradle-plugin"
}

// The version lives only in package.json; the Expo plugin needs it for its publication metadata.
def packageVersion = new JsonSlurper().parse(file("../package.json")).version

group = "expo.modules.audioengine"
version = packageVersion

android {
  namespace "expo.modules.audioengine"
  ndkVersion "27.1.12297006"

  defaultConfig {
    versionCode 1
    versionName packageVersion
  }

  // Note: No native build needed here - we use the android-engine library
  // which provides libsezo_audio_engine.so through the Gradle dependency

  buildTypes {
    release {
      minifyEnabled false
    }
    debug {
      minifyEnabled false
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

kotlin {
  compilerOptions {
    jvmTarget = JvmTarget.JVM_17
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.13.1"
  implementation "androidx.media:media:1.7.0"

  // Link to the android-engine package when available, otherwise fall back to JitPack.
  def androidEngineProject = rootProject.findProject(":android-engine")
  if (androidEngineProject != null) {
    implementation androidEngineProject
  } else {
    def sezoAudioEngineVersion = project.findProperty("sezoAudioEngineVersion") ?: "android-engine-v0.1.9"
    implementation "com.github.Sepzie:SezoAudioEngine:${sezoAudioEngineVersion}"
  }
}
